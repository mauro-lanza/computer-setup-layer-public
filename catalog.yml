  - id: vscode-pdf
    desc: "VS Code: PDF viewer"
    type: vscode
    packages: tomoki1207.pdf
    requires_vscode: true
  - id: vscode-remote-containers
    desc: "VS Code: Remote Containers"
    type: vscode
    packages: ms-vscode-remote.remote-containers
    requires_vscode: true
  - id: vscode-better-comments
    desc: "VS Code: Better Comments"
    type: vscode
    packages: aaron-bond.better-comments
    requires_vscode: true
  - id: vscode-regex
    desc: "VS Code: Regex Previewer"
    type: vscode
    packages: chrmarti.regex
    requires_vscode: true
  - id: vscode-parquet-viewer
    desc: "VS Code: Parquet Viewer"
