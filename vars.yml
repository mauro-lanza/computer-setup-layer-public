---
# Baseline values for the engine's roles. Lists append across layers; scalars are overridden by higher priority.

# git/gh/yq/uv are also bootstrap prerequisites; listing them keeps them drift-managed.
# `ansible` is absent on purpose: the engine runs its own pinned ansible-core.
homebrew_baseline_formulae:
  - git
  - gh
  - jq
  - gnupg
  - uv
  - pre-commit
  - tree
  - yq
  - python@3.14
  - powerlevel10k
  - zsh-autosuggestions
  - zsh-fast-syntax-highlighting

# Casks always installed.
homebrew_baseline_casks:
  - rectangle
  # files/p10k.zsh uses nerdfont-v3 icons; this is also the terminal font (terminal_font_family) and must be selected in your terminal profile once.
  - font-meslo-lg-nerd-font

# Casks safe to `--adopt`; protected-payload casks can lose the existing app on failure.
homebrew_adopt_casks:
  - rectangle
  - visual-studio-code
  - firefox
  - discord
  - spotify

# Extensions live in the `vscode-extensions` capability.

# Editor extension managers; the engine names no editor.
extension_managers:
  - id: vscode
    capability: vscode
    binary: "/Applications/Visual Studio Code.app/Contents/Resources/app/bin/code"
    list_args: [--list-extensions]
    install_args: [--install-extension]
    settings_key: vscode/settings.json
    settings_dest: "{{ home_dir }}/Library/Application Support/Code/User/settings.json"

# The prompt config sits in `configs/` because the zshrc snippet glob is non-recursive (loads after the theme).
shell_config_files:
  - key: zshrc
    dest: "{{ home_dir }}/.zshrc"
    backup: true
  - key: p10k.zsh
    dest: "{{ home_dir }}/.zsh/configs/p10k.zsh"

# ─── git (git role) ──────────────────────────────────────────────────────────
git_default_branch: main
git_config_sections:
  pull:
    rebase: "true"
  fetch:
    prune: "true"
  push:
    autoSetupRemote: "true"
  rerere:
    enabled: "true"
git_global_gitignore_entries:
  - .DS_Store
  - "*.pyc"
  - __pycache__/
  - .env
  - .venv/
  - venv/
  - .idea/
  - .vscode/
  - .codanna/
  - .codannaignore
  - .fastembed_cache

# ─── macOS system defaults (macos role) ──────────────────────────────────────
# Native YAML types (not strings) for osx_defaults idempotency.
macos_defaults:
  # Preset so a fresh machine never shows SwiftBar's plugin-folder dialog.
  - domain: com.ameba.SwiftBar
    key: PluginDirectory
    type: string
    value: "{{ home_dir }}/.local/share/computer-setup/swiftbar"
  - domain: NSGlobalDomain          # Finder: show all file extensions
    key: AppleShowAllExtensions
    type: bool
    value: true
    notify: Restart Dock and Finder
  - domain: com.apple.dock          # Dock: hide recent apps
    key: show-recents
    type: bool
    value: false
    notify: Restart Dock and Finder
  - domain: com.apple.dock          # Dock: icon size (float — matches defaults(1))
    key: tilesize
    type: float
    value: 32
    notify: Restart Dock and Finder
  - domain: com.apple.finder        # Finder: new window opens home folder
    key: NewWindowTarget
    type: string
    value: PfHm
    notify: Restart Dock and Finder
  - domain: com.apple.finder
    key: NewWindowTargetPath
    type: string
    value: "file://{{ home_dir }}/"
    notify: Restart Dock and Finder
  # `int`, not `bool`: macOS stores it as an integer and osx_defaults refuses to change a key's type.
  - domain: com.apple.AppleMultitouchTrackpad         # Trackpad: tap to click
    key: Clicking
    type: int
    value: 1
  - domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
    key: Clicking
    type: int
    value: 1
  # Also `int`, not `bool`.
  - domain: com.apple.AppleMultitouchTrackpad         # Trackpad: tap-drag
    key: Dragging
    type: int
    value: 1
  - domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
    key: Dragging
    type: int
    value: 1

  # ─── Keyboard & text ───
  # Double-space period fights with code and terminal input.
  - domain: NSGlobalDomain
    key: NSAutomaticPeriodSubstitutionEnabled
    type: bool
    value: false

  # ─── Mouse ───
  # Default OneButton leaves no context-menu click.
  - domain: com.apple.driver.AppleBluetoothMultitouch.mouse
    key: MouseButtonMode
    type: string
    value: TwoButton

  # ─── Window management ───
  # Rectangle owns window layout; two tilers would compete.
  - domain: com.apple.WindowManager                   # tile on drag to screen edge
    key: EnableTilingByEdgeDrag
    type: bool
    value: false
  - domain: com.apple.WindowManager                   # hold Option to tile
    key: EnableTilingOptionAccelerator
    type: bool
    value: false
  - domain: com.apple.WindowManager                   # tile on drag to top edge
    key: EnableTopTilingByEdgeDrag
    type: bool
    value: false

  # ─── Hot corners ───
  # Each corner needs its modifier declared, or it fires only while a modifier is held.
  # Action codes: 1 = disabled, 2 = Mission Control, 14 = Quick Note.
  - domain: com.apple.dock                            # top-left: Mission Control
    key: wvous-tl-corner
    type: int
    value: 2
    notify: Restart Dock and Finder
  - domain: com.apple.dock
    key: wvous-tl-modifier
    type: int
    value: 0
    notify: Restart Dock and Finder
  # Quick Note (14) is the default here and fires on cursor overshoot.
  - domain: com.apple.dock                            # bottom-right: disabled
    key: wvous-br-corner
    type: int
    value: 1
    notify: Restart Dock and Finder
  - domain: com.apple.dock
    key: wvous-br-modifier
    type: int
    value: 0
    notify: Restart Dock and Finder

  # ─── Dock ───
  - domain: com.apple.dock          # don't enter Mission Control on top-edge drag
    key: enterMissionControlByTopWindowDrag
    type: bool
    value: false
    notify: Restart Dock and Finder

  # ─── Finder ───
  - domain: com.apple.finder        # default to icon view in new windows
    key: FXPreferredViewStyle
    type: string
    value: icnv
    notify: Restart Dock and Finder
  - domain: com.apple.finder        # folders sort above loose files
    key: _FXSortFoldersFirst
    type: bool
    value: true
    notify: Restart Dock and Finder

  # ─── Menu bar ───
  - domain: com.apple.menuextra.clock
    key: ShowSeconds
    type: bool
    value: true
  - domain: com.apple.menuextra.clock
    key: IsAnalog
    type: bool
    value: false
  # ByHost preference: without `host: currentHost` it writes the wrong plist.
  - domain: com.apple.controlcenter
    key: BatteryShowPercentage
    type: bool
    value: false
    host: currentHost

# Applied only when the app is installed.
macos_conditional_defaults:
  - app: /Applications/Rectangle.app
    defaults:
      - domain: com.knollsoft.Rectangle
        key: launchOnLogin
        type: bool
        value: true
      - domain: com.knollsoft.Rectangle
        key: hideMenubarIcon
        type: bool
        value: true
      - domain: com.knollsoft.Rectangle
        key: allowAnyShortcut
        type: bool
        value: true
      - domain: com.knollsoft.Rectangle
        key: alternateDefaultShortcuts
        type: bool
        value: true

# ─── Runtimes (runtimes role) ────────────────────────────────────────────────
# Was pinned in the engine's own defaults, which contradicted "the engine ships
# no personal data" and silently reverted a hand-set version on every drift run.
# It is a choice, so it lives in a layer.
runtimes_tfenv_terraform_version: "1.12.2"

# ─── Shared values consumed by config TEMPLATES ──────────────────────────────
# Read by this layer's templates, not by other vars (layer vars cannot reference each other).

# Provider-prefixed model id, as opencode expects.
ai_default_model: "github-copilot/claude-sonnet-5.5"

# Model for opencode's hidden title agent; short generations don't need the default.
ai_title_model: "github-copilot/claude-haiku-5.5"

# Bare model id, as Zed's copilot_chat provider expects (no provider prefix).
ai_chat_model: "claude-sonnet-5.5"

# Mono variant: p10k's icon padding assumes one-cell icons. Read by the vscode and zed templates.
terminal_font_family: "MesloLGS Nerd Font Mono"

# Model id in GitLens' "<vendor>:<model>" form.
ai_gitlens_model: "copilot:gpt-4.1"

# Needs check-merged-branches; 08:30 runs before the 09:00 upgrade. --auto-delete is required because a LaunchAgent has no terminal.
scheduled_agents:
  - label: com.computer-setup.branch-cleanup
    program: "{{ home_dir }}/.local/bin/check_merged_branches"
    args:
      - --all-repos
      - --auto-delete
      - --quiet
    hour: 8
    minute: 30
    requires_capability: check-merged-branches

# Reports only while the credential is missing.
logins:
  - id: gcloud
    desc: "gcloud (Google Cloud SDK)"
    requires_capability: gcloud
    # SQLite store with only gcloud's own credentials: the file existing is the answer.
    detect_file: "{{ home_dir }}/.config/gcloud/credentials.db"
    remedy: "gcloud auth login"
