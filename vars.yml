---
# Baseline variable values consumed by the orchestrator's roles.
# These fill the orchestrator's "safe empty" defaults with a shareable baseline.
# Lists append across layers; scalars are overridden by higher-priority layers.

# ─── Homebrew baseline (homebrew role) ───────────────────────────────────────
# Formulae always installed. git/gh/yq/ansible are also bootstrap prerequisites
# (installed in Phase 0); listing them here keeps them under drift management.
homebrew_baseline_formulae:
  - git
  - gh
  - jq
  - gnupg
  - ansible
  - pre-commit
  - tree
  - yq
  - python@3.14
  - powerlevel10k
  - zsh-autosuggestions
  - zsh-fast-syntax-highlighting

# Casks always installed.
homebrew_baseline_casks:
  - rectangle
  # Required by the prompt: files/p10k.zsh runs POWERLEVEL9K_MODE=nerdfont-v3
  # with segment icons enabled, which renders Nerd Font Private Use Area glyphs
  # (U+F07C folder, U+F1D3 git). Without this cask those show as tofu.
  #
  # This was previously listed with a justification that had stopped being true:
  # the config said `powerline` mode while blanking every icon and separator, so
  # the prompt rendered zero PUA glyphs and the font was baseline for no reason.
  # Verify after changing the prompt config with:
  #   print -rn -- "${(%%)PS1}"   (look for U+E000-U+F8FF)
  #
  # Also the integrated-terminal font for both editors (terminal_font_family
  # below). Meslo LG is Apple's Menlo with disambiguated glyphs and Nerd Font
  # icons, so it matches the system look. Installing it does NOT select it — set
  # it as your terminal profile font once.
  - font-meslo-lg-nerd-font

# Casks safe to `--adopt` when already present in /Applications but not
# Homebrew-managed. Keep explicit: some casks with protected payloads can fail
# adoption and remove the existing app.
homebrew_adopt_casks:
  - rectangle
  - visual-studio-code
  - firefox
  - discord
  - spotify

# ─── Editors ─────────────────────────────────────────────────────────────────
# Extensions live in the `vscode-extensions` capability in capabilities.yml as a
# single all-or-nothing group, so bootstrap asks one question instead of one per
# extension.

# Editor extension managers. The engine names no editor — it loops over this
# list, so switching to VSCodium or Cursor, or managing two editors at once, is
# a change here rather than in engine code.
extension_managers:
  - id: vscode
    capability: vscode
    binary: "/Applications/Visual Studio Code.app/Contents/Resources/app/bin/code"
    list_args: [--list-extensions]
    install_args: [--install-extension]
    settings_key: vscode/settings.json
    settings_dest: "{{ home_dir }}/Library/Application Support/Code/User/settings.json"

# ─── git (git role) ──────────────────────────────────────────────────────────
git_default_branch: main
git_config_sections:
  pull:
    rebase: "true"
  fetch:
    prune: "true"
  push:
    autoSetupRemote: "true"
  rerere:
    enabled: "true"
git_global_gitignore_entries:
  - .DS_Store
  - "*.pyc"
  - __pycache__/
  - .env
  - .venv/
  - venv/
  - .idea/
  - .vscode/

# ─── macOS system defaults (macos role) ──────────────────────────────────────
# Native YAML types (not strings) for osx_defaults idempotency.
macos_defaults:
  - domain: NSGlobalDomain          # Finder: show all file extensions
    key: AppleShowAllExtensions
    type: bool
    value: true
    notify: Restart Dock and Finder
  - domain: com.apple.dock          # Dock: hide recent apps
    key: show-recents
    type: bool
    value: false
    notify: Restart Dock and Finder
  - domain: com.apple.dock          # Dock: icon size (float — matches defaults(1))
    key: tilesize
    type: float
    value: 32
    notify: Restart Dock and Finder
  - domain: com.apple.finder        # Finder: new window opens home folder
    key: NewWindowTarget
    type: string
    value: PfHm
    notify: Restart Dock and Finder
  - domain: com.apple.finder
    key: NewWindowTargetPath
    type: string
    value: "file://{{ home_dir }}/"
    notify: Restart Dock and Finder
  # Tap to click. `int`, NOT `bool`: macOS itself stores this as an integer, and
  # osx_defaults refuses to change an existing key's type — declaring bool failed
  # on a fresh Mac with "Type mismatch. Type in defaults: int". A machine this
  # playbook has already run on reports `boolean`, but that is the type the
  # playbook wrote, not the one macOS uses natively. Trust a fresh machine.
  - domain: com.apple.AppleMultitouchTrackpad         # Trackpad: tap to click
    key: Clicking
    type: int
    value: 1
  - domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
    key: Clicking
    type: int
    value: 1

# Defaults applied only when the app is actually installed. Pure layer data, so
# swapping Rectangle for Raycast/Amethyst/AeroSpace is a change here rather than
# in the orchestrator.
macos_conditional_defaults:
  - app: /Applications/Rectangle.app
    defaults:
      - domain: com.knollsoft.Rectangle
        key: launchOnLogin
        type: bool
        value: true
      - domain: com.knollsoft.Rectangle
        key: hideMenubarIcon
        type: bool
        value: true
      - domain: com.knollsoft.Rectangle
        key: allowAnyShortcut
        type: bool
        value: true
      - domain: com.knollsoft.Rectangle
        key: alternateDefaultShortcuts
        type: bool
        value: true

# ─── Runtimes (runtimes role) ────────────────────────────────────────────────
# Was pinned in the engine's own defaults, which contradicted "the engine ships
# no personal data" and silently reverted a hand-set version on every drift run.
# It is a choice, so it lives in a layer.
runtimes_tfenv_terraform_version: "1.12.2"

# Casks needing root are handled by drift-update passing a sudo password through
# to the homebrew_cask module's SUDO_ASKPASS support, so none need excluding.
# Set `upgrade_casks_exclude` if you ever want a cask's own updater to own the
# job entirely.

# ─── Shared values consumed by config TEMPLATES ──────────────────────────────
# These exist so one decision lives in one place. They are read by this layer's
# templates/ (rendered late, after the layer merge), NOT by other vars in this
# file — a layer var cannot reference another layer var (see docs/architecture.md).
# Anything derivable from a list above is derived in the template instead of
# being restated here; see files/shell/20-aliases.zsh.j2 for the Python version.

# Provider-prefixed model id, as opencode and Zed's agent_servers expect.
# Read by templates/opencode.json.j2 and templates/zed/settings.json.j2.
ai_default_model: "github-copilot/claude-opus-4.8"

# Bare model id, as Zed's copilot_chat provider expects (no provider prefix).
ai_chat_model: "claude-sonnet-4.6"

# Font for the integrated terminals. Powerlevel10k runs in `powerline` mode with
# POWERLEVEL9K_ICON_PADDING=none, which assumes icons occupy exactly ONE cell —
# so the Mono variant, not the proportional default. Provided by the
# font-meslo-lg-nerd-font cask above.
#
# Read by the vscode and zed settings templates so the two cannot drift; the
# shell cannot set this, since the font belongs to whatever renders the glyphs.
terminal_font_family: "MesloLGS Nerd Font Mono"

# Model id in GitLens' "<vendor>:<model>" form.
ai_gitlens_model: "copilot:gpt-4.1"
