---
# Baseline variable values consumed by the orchestrator's roles.
# These fill the orchestrator's "safe empty" defaults with a shareable baseline.
# Lists append across layers; scalars are overridden by higher-priority layers.

# ─── Homebrew baseline (homebrew role) ───────────────────────────────────────
# Formulae always installed. git/gh/yq/uv are also bootstrap prerequisites
# (installed in Phase 0); listing them here keeps them under drift management.
#
# `ansible` is deliberately ABSENT. The engine runs a pinned ansible-core
# installed by `uv` into ~/.local/share/computer-setup/runtime, so that an
# unattended `brew upgrade` cannot move the fleet across an ansible-core major
# overnight. See runtime.yml in the engine repo. The Homebrew formula was also
# the 530M community bundle of ~800 collections, of which this playbook uses
# exactly two — and the one it needs is already installed, pinned, from
# requirements.yml.
#
# Nothing puts that runtime on PATH: it is the engine's private interpreter.
# Develop against the repo with a project venv, as with any Python project.
homebrew_baseline_formulae:
  - git
  - gh
  - jq
  - gnupg
  - uv
  - pre-commit
  - tree
  - yq
  - python@3.14
  - powerlevel10k
  - zsh-autosuggestions
  - zsh-fast-syntax-highlighting

# Casks always installed.
homebrew_baseline_casks:
  - rectangle
  # Required by the prompt: files/p10k.zsh runs POWERLEVEL9K_MODE=nerdfont-v3
  # with segment icons enabled, which renders Nerd Font Private Use Area glyphs
  # (U+F07C folder, U+F1D3 git). Without this cask those show as tofu.
  #
  # This was previously listed with a justification that had stopped being true:
  # the config said `powerline` mode while blanking every icon and separator, so
  # the prompt rendered zero PUA glyphs and the font was baseline for no reason.
  # Verify after changing the prompt config with:
  #   print -rn -- "${(%%)PS1}"   (look for U+E000-U+F8FF)
  #
  # Also the integrated-terminal font for both editors (terminal_font_family
  # below). Meslo LG is Apple's Menlo with disambiguated glyphs and Nerd Font
  # icons, so it matches the system look. Installing it does NOT select it — set
  # it as your terminal profile font once.
  - font-meslo-lg-nerd-font

# Casks safe to `--adopt` when already present in /Applications but not
# Homebrew-managed. Keep explicit: some casks with protected payloads can fail
# adoption and remove the existing app.
homebrew_adopt_casks:
  - rectangle
  - visual-studio-code
  - firefox
  - discord
  - spotify

# ─── Editors ─────────────────────────────────────────────────────────────────
# Extensions live in the `vscode-extensions` capability in capabilities.yml as a
# single all-or-nothing group, so bootstrap asks one question instead of one per
# extension.

# Editor extension managers. The engine names no editor — it loops over this
# list, so switching to VSCodium or Cursor, or managing two editors at once, is
# a change here rather than in engine code.
extension_managers:
  - id: vscode
    capability: vscode
    binary: "/Applications/Visual Studio Code.app/Contents/Resources/app/bin/code"
    list_args: [--list-extensions]
    install_args: [--install-extension]
    settings_key: vscode/settings.json
    settings_dest: "{{ home_dir }}/Library/Application Support/Code/User/settings.json"

# ─── git (git role) ──────────────────────────────────────────────────────────
git_default_branch: main
git_config_sections:
  pull:
    rebase: "true"
  fetch:
    prune: "true"
  push:
    autoSetupRemote: "true"
  rerere:
    enabled: "true"
git_global_gitignore_entries:
  - .DS_Store
  - "*.pyc"
  - __pycache__/
  - .env
  - .venv/
  - venv/
  - .idea/
  - .vscode/

# ─── macOS system defaults (macos role) ──────────────────────────────────────
# Native YAML types (not strings) for osx_defaults idempotency.
macos_defaults:
  - domain: NSGlobalDomain          # Finder: show all file extensions
    key: AppleShowAllExtensions
    type: bool
    value: true
    notify: Restart Dock and Finder
  - domain: com.apple.dock          # Dock: hide recent apps
    key: show-recents
    type: bool
    value: false
    notify: Restart Dock and Finder
  - domain: com.apple.dock          # Dock: icon size (float — matches defaults(1))
    key: tilesize
    type: float
    value: 32
    notify: Restart Dock and Finder
  - domain: com.apple.finder        # Finder: new window opens home folder
    key: NewWindowTarget
    type: string
    value: PfHm
    notify: Restart Dock and Finder
  - domain: com.apple.finder
    key: NewWindowTargetPath
    type: string
    value: "file://{{ home_dir }}/"
    notify: Restart Dock and Finder
  # Tap to click. `int`, NOT `bool`: macOS itself stores this as an integer, and
  # osx_defaults refuses to change an existing key's type — declaring bool failed
  # on a fresh Mac with "Type mismatch. Type in defaults: int". A machine this
  # playbook has already run on reports `boolean`, but that is the type the
  # playbook wrote, not the one macOS uses natively. Trust a fresh machine.
  - domain: com.apple.AppleMultitouchTrackpad         # Trackpad: tap to click
    key: Clicking
    type: int
    value: 1
  - domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
    key: Clicking
    type: int
    value: 1
  # Dragging (move a window by dragging after a tap). Same int-not-bool trap as
  # Clicking above: verified with `defaults read-type` on a fresh machine, which
  # reports integer. The old machine reported boolean — but that was this
  # playbook's own earlier write, not macOS's native type.
  - domain: com.apple.AppleMultitouchTrackpad         # Trackpad: tap-drag
    key: Dragging
    type: int
    value: 1
  - domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
    key: Dragging
    type: int
    value: 1

  # ─── Keyboard & text ───
  # Double-space at the end of a sentence inserting a period. Fights with code
  # and terminal input, so it stays off.
  - domain: NSGlobalDomain
    key: NSAutomaticPeriodSubstitutionEnabled
    type: bool
    value: false

  # ─── Mouse ───
  # Magic Mouse: enable the right-hand click region. Default is OneButton, which
  # leaves the mouse with no context-menu click at all.
  - domain: com.apple.driver.AppleBluetoothMultitouch.mouse
    key: MouseButtonMode
    type: string
    value: TwoButton

  # ─── Window management ───
  # macOS built-in tiling is disabled wholesale: Rectangle owns window layout,
  # and leaving both enabled means edge-drags fire two competing tilers.
  - domain: com.apple.WindowManager                   # tile on drag to screen edge
    key: EnableTilingByEdgeDrag
    type: bool
    value: false
  - domain: com.apple.WindowManager                   # hold Option to tile
    key: EnableTilingOptionAccelerator
    type: bool
    value: false
  - domain: com.apple.WindowManager                   # tile on drag to top edge
    key: EnableTopTilingByEdgeDrag
    type: bool
    value: false

  # ─── Hot corners ───
  # Corner actions and their modifier keys are set in pairs. The modifier must be
  # declared explicitly: leaving it unset makes the corner fire only while a
  # modifier is held, which reads as "the setting silently did nothing".
  # Action codes: 1 = disabled, 2 = Mission Control, 14 = Quick Note.
  - domain: com.apple.dock                            # top-left: Mission Control
    key: wvous-tl-corner
    type: int
    value: 2
    notify: Restart Dock and Finder
  - domain: com.apple.dock
    key: wvous-tl-modifier
    type: int
    value: 0
    notify: Restart Dock and Finder
  # Bottom-right ships as Quick Note (14) and triggers on any stray cursor
  # overshoot toward the scrollbar. Explicitly disabled.
  - domain: com.apple.dock                            # bottom-right: disabled
    key: wvous-br-corner
    type: int
    value: 1
    notify: Restart Dock and Finder
  - domain: com.apple.dock
    key: wvous-br-modifier
    type: int
    value: 0
    notify: Restart Dock and Finder

  # ─── Dock ───
  - domain: com.apple.dock          # don't enter Mission Control on top-edge drag
    key: enterMissionControlByTopWindowDrag
    type: bool
    value: false
    notify: Restart Dock and Finder

  # ─── Finder ───
  - domain: com.apple.finder        # default to icon view in new windows
    key: FXPreferredViewStyle
    type: string
    value: icnv
    notify: Restart Dock and Finder
  - domain: com.apple.finder        # folders sort above loose files
    key: _FXSortFoldersFirst
    type: bool
    value: true
    notify: Restart Dock and Finder

  # ─── Menu bar ───
  - domain: com.apple.menuextra.clock
    key: ShowSeconds
    type: bool
    value: true
  - domain: com.apple.menuextra.clock
    key: IsAnalog
    type: bool
    value: false
  # Battery percentage is a ByHost preference — it lives in
  # ~/Library/Preferences/ByHost and a plain `defaults read` cannot see it.
  # Without `host: currentHost` this silently writes to the wrong plist and the
  # menu bar never changes.
  - domain: com.apple.controlcenter
    key: BatteryShowPercentage
    type: bool
    value: false
    host: currentHost

# Defaults applied only when the app is actually installed. Pure layer data, so
# swapping Rectangle for Raycast/Amethyst/AeroSpace is a change here rather than
# in the orchestrator.
macos_conditional_defaults:
  - app: /Applications/Rectangle.app
    defaults:
      - domain: com.knollsoft.Rectangle
        key: launchOnLogin
        type: bool
        value: true
      - domain: com.knollsoft.Rectangle
        key: hideMenubarIcon
        type: bool
        value: true
      - domain: com.knollsoft.Rectangle
        key: allowAnyShortcut
        type: bool
        value: true
      - domain: com.knollsoft.Rectangle
        key: alternateDefaultShortcuts
        type: bool
        value: true

# ─── Runtimes (runtimes role) ────────────────────────────────────────────────
# Was pinned in the engine's own defaults, which contradicted "the engine ships
# no personal data" and silently reverted a hand-set version on every drift run.
# It is a choice, so it lives in a layer.
runtimes_tfenv_terraform_version: "1.12.2"

# Casks needing root are handled by drift-update passing a sudo password through
# to the homebrew_cask module's SUDO_ASKPASS support, so none need excluding.
# Set `upgrade_casks_exclude` if you ever want a cask's own updater to own the
# job entirely.

# ─── Shared values consumed by config TEMPLATES ──────────────────────────────
# These exist so one decision lives in one place. They are read by this layer's
# templates/ (rendered late, after the layer merge), NOT by other vars in this
# file — a layer var cannot reference another layer var (see docs/architecture.md).
# Anything derivable from a list above is derived in the template instead of
# being restated here; see files/shell/20-aliases.zsh.j2 for the Python version.

# Provider-prefixed model id, as opencode and Zed's agent_servers expect.
# Read by templates/opencode.json.j2 and templates/zed/settings.json.j2.
ai_default_model: "github-copilot/claude-sonnet-5"

# Bare model id, as Zed's copilot_chat provider expects (no provider prefix).
ai_chat_model: "claude-sonnet-5"

# Font for the integrated terminals. Powerlevel10k runs in `powerline` mode with
# POWERLEVEL9K_ICON_PADDING=none, which assumes icons occupy exactly ONE cell —
# so the Mono variant, not the proportional default. Provided by the
# font-meslo-lg-nerd-font cask above.
#
# Read by the vscode and zed settings templates so the two cannot drift; the
# shell cannot set this, since the font belongs to whatever renders the glyphs.
terminal_font_family: "MesloLGS Nerd Font Mono"

# Model id in GitLens' "<vendor>:<model>" form.
ai_gitlens_model: "copilot:gpt-4.1"

# ─── Scheduled jobs (scheduled_agents role) ──────────────────────────────────
# Keeps local branches tidy across every checkout without being asked. Gated on
# `requires_capability`, so removing the check-merged-branches capability
# removes the agent with it rather than leaving a plist pointing at a script
# that is no longer deployed.
#
# 08:30 is deliberately ahead of the 09:00 upgrade and 10:00 drift agents: it
# touches only local branches and finishes fast, so it should not queue behind
# a Homebrew upgrade. --auto-delete is required because a LaunchAgent has no
# terminal, and without it the script reports and deletes nothing. --quiet drops
# the repos with nothing to say, which over ~70 checkouts is the difference
# between a 700-line log and a 100-line one.
scheduled_agents:
  - label: com.computer-setup.branch-cleanup
    program: "{{ home_dir }}/.local/bin/check_merged_branches"
    args:
      - --all-repos
      - --auto-delete
      - --quiet
    hour: 8
    minute: 30
    requires_capability: check-merged-branches

# ─── Credentials a person has to obtain ──────────────────────────────────────
# Replaces the reminder "Run: gcloud auth login (if using GCP)", which printed
# on every run whether or not it had been done — including on machines that had
# been signed in for months. This reports only while the credential is actually
# missing.
logins:
  - id: gcloud
    desc: "gcloud (Google Cloud SDK)"
    requires_capability: gcloud
    # No key: gcloud's credential store is SQLite, not JSON, and it holds only
    # gcloud's own credentials — so the file existing IS the answer.
    detect_file: "{{ home_dir }}/.config/gcloud/credentials.db"
    remedy: "gcloud auth login"
