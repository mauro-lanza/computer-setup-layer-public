---
# Capability catalog (public layer). Each entry is a selectable capability whose
# `id` is the selection token. Merged (union by id) with other layers' catalogs
# into the bootstrap menu and the engine's capability registry.
#
# Schema:
#   - id:       Stable capability token (used to remember prior answers).
#               Never rename; treat like a primary key.
#   - desc:     Human-readable label shown in the prompt.
#   - type:     formula | cask | vscode | feature   (feature = no package)
#   - packages: Space-separated brew formulae / casks / extension IDs installed
#               when selected (omit for `feature`). Tap-qualified formula names
#               (e.g. user/tap/formula) are supported — Homebrew taps on install.
#   - requires_vscode: (optional, bool) Only prompt if VS Code is selected
#                      this run OR `code` is already on PATH.
#   - config:   (optional) files/templates deployed when the capability is active
#               (highest-priority layer supplies the file):
#                 - { src: <layer file key>, dest: <path>, kind: file|template,
#                     mode: <octal string, default "0644"> }
#   - adopt_if_present: (optional) a path; when it exists the capability is
#               treated as active even if not selected (adopt an existing install).
#   - reminders: (optional) list of post-setup message strings shown when active.
#
# Adding a new item: append below with a unique id. That's it.

capabilities:
  # ─── Formulae ─────────────────────────────────────────────────────────────
  - id: nvm
    desc: "Node Version Manager (nvm)"
    type: formula
    packages: nvm
    adopt_if_present: /opt/homebrew/opt/nvm/nvm.sh
  - id: uv
    desc: "Fast Python package manager (uv)"
    type: formula
    packages: uv
  - id: ansible-lint
    desc: "ansible-lint (required to develop computer-setup itself)"
    type: formula
    packages: ansible-lint
    # `scripts/check.sh` runs ansible-lint as a gate. Undeclared, it was the one
    # tool on the machine that nothing installed — so a rebuilt Mac ran the gate
    # with the linter missing and still exited 0. Adopt it wherever it already
    # exists so an existing dev machine stays managed without re-selecting.
    adopt_if_present: /opt/homebrew/bin/ansible-lint
  - id: tfenv
    desc: "Terraform version manager (tfenv)"
    type: formula
    packages: tfenv
    adopt_if_present: /opt/homebrew/bin/tfenv
  - id: docker-cli
    desc: "Docker CLI + Buildx + Compose"
    type: formula
    packages: docker docker-buildx docker-compose
    # Note: installing the formula gives a CLI that survives Docker Desktop
    # being closed — required for using Colima as the runtime.
  - id: colima
    desc: "Colima (lightweight Docker runtime)"
    type: formula
    packages: colima
  - id: mariadb
    desc: "MariaDB database"
    type: formula
    packages: mariadb
  - id: fswatch
    desc: "File system watcher (fswatch)"
    type: formula
    packages: fswatch
  - id: terraform-docs
    desc: "Terraform documentation generator"
    type: formula
    packages: terraform-docs
  - id: opencode
    desc: "OpenCode CLI"
    type: formula
    packages: anomalyco/tap/opencode
    adopt_if_present: /opt/homebrew/bin/opencode
    # The GitHub MCP token is injected at runtime via OC_GITHUB_PERSONAL_ACCESS_TOKEN
    # ({env:...} in the config) — no secret is stored.
    config:
      - src: opencode.json
        dest: "{{ home_dir }}/.config/opencode/opencode.json"
  - id: act
    desc: "Run GitHub Actions locally (act)"
    type: formula
    packages: act
  - id: ocrmypdf
    desc: "OCR for PDFs (ocrmypdf)"
    type: formula
    packages: ocrmypdf
  - id: ripgrep
    desc: "Ripgrep (fast search)"
    type: formula
    packages: ripgrep
  - id: bun
    desc: "Bun (JS runtime & package manager)"
    type: formula
    packages: bun
  - id: duckdb
    desc: "DuckDB (in-process analytical SQL)"
    type: formula
    packages: duckdb
  - id: tio
    desc: "tio (serial device terminal)"
    type: formula
    packages: tio
  - id: baobab
    desc: "Baobab (disk usage analyzer)"
    type: formula
    packages: baobab
  - id: eim
    desc: "Espressif IDE Manager (ESP-IDF toolchain)"
    type: formula
    packages: espressif/eim/eim
    adopt_if_present: /opt/homebrew/bin/eim
  - id: tectonic
    desc: "Tectonic (self-contained LaTeX engine)"
    type: formula
    packages: tectonic
  - id: gemini-cli
    desc: "Gemini CLI"
    type: formula
    packages: gemini-cli
    adopt_if_present: /opt/homebrew/bin/gemini
  - id: crane
    desc: "crane (container registry / image tool)"
    type: formula
    packages: crane
  - id: poppler
    desc: "Poppler PDF utilities (pdftotext, pdfimages, ...)"
    type: formula
    packages: poppler
  - id: python-311
    desc: "Python 3.11 (pinned interpreter alongside the 3.14 baseline)"
    type: formula
    packages: python@3.11
  - id: bitmap-fonts
    desc: "Bitmap font conversion tools (bdftopcf, otf2bdf)"
    type: formula
    packages: bdftopcf otf2bdf

  # ─── Personal scripts (~/.local/bin) ───────────────────────────────────────
  # A collection of standalone tools with no package to install — each is
  # just a script deployed to ~/.local/bin (already on PATH via path.zsh).
  # To add another: drop the file in files/scripts/ and add an entry here.
  - id: check-merged-branches
    desc: "check_merged_branches (clean up local branches whose PRs already merged)"
    type: feature
    config:
      - src: scripts/check_merged_branches
        dest: "{{ home_dir }}/.local/bin/check_merged_branches"
        mode: "0755"

  # ─── Casks ────────────────────────────────────────────────────────────────
  - id: 1password
    desc: "1Password"
    type: cask
    packages: 1password
    reminders: ["Open 1Password and sign in"]
  - id: vscode
    desc: "Visual Studio Code"
    type: cask
    packages: visual-studio-code
    adopt_if_present: "{{ vscode_code_binary }}"
  - id: firefox
    desc: "Firefox browser"
    type: cask
    packages: firefox
  - id: docker-desktop
    desc: "Docker Desktop"
    type: cask
    packages: docker-desktop
  - id: stats
    desc: "Stats (system monitor)"
    type: cask
    packages: stats
  - id: zed
    desc: "Zed editor"
    type: cask
    packages: zed
    config:
      - src: zed/settings.json
        dest: "{{ home_dir }}/.config/zed/settings.json"
  - id: discord
    desc: "Discord"
    type: cask
    packages: discord
  - id: spotify
    desc: "Spotify"
    type: cask
    packages: spotify
  - id: obsidian
    desc: "Obsidian notes"
    type: cask
    packages: obsidian
  - id: postman
    desc: "Postman API client"
    type: cask
    packages: postman
  - id: notunes
    desc: "noTunes (prevent Apple Music)"
    type: cask
    packages: notunes
  - id: lm-studio
    desc: "LM Studio (local LLMs)"
    type: cask
    packages: lm-studio
  - id: gcloud
    desc: "Google Cloud SDK (gcloud CLI)"
    type: cask
    packages: gcloud-cli
    # Homebrew install location (NOT ~/google-cloud-sdk, which is the deprecated
    # manual install path). Present ⇒ adopt and keep the gcloud config managed.
    adopt_if_present: /opt/homebrew/share/google-cloud-sdk
    reminders: ["Run: gcloud auth login (if using GCP)"]
  - id: orcaslicer
    desc: "OrcaSlicer (3D print slicer)"
    type: cask
    packages: orcaslicer
  - id: kicad
    desc: "KiCad (EDA / PCB design)"
    type: cask
    packages: kicad
  - id: antigravity
    desc: "Antigravity (Google AI IDE)"
    type: cask
    packages: antigravity
  - id: opencode-desktop
    desc: "OpenCode Desktop (GUI companion to the OpenCode CLI)"
    type: cask
    packages: opencode-desktop

  # ─── VS Code extensions ───────────────────────────────────────────────────
  # Extensions are configuration, not individually-chosen tools — nobody wants
  # to answer "Rainbow CSV? [y/N]" on a fresh machine. They ship as ONE
  # all-or-nothing group so bootstrap asks a single question.
  #
  # Adding an extension: append its id to `packages` below. No new capability,
  # no new prompt.
  #
  # Not in the pack, add if you want it:
  #   innoverio.vscode-dbt-power-user   (dbt Power User — was a catalog option
  #                                      but had never been selected)
  #
  # Machine-specific groups: a higher-priority layer adds its own capability
  # with a DIFFERENT id (e.g. `vscode-extensions-work` in the work layer). The
  # engine concatenates the packages of every active `type: vscode` capability,
  # so groups compose. Do NOT reuse the id below in another layer — capabilities
  # merge by id and the higher-priority one would replace this list wholesale
  # rather than extend it.
  - id: vscode-extensions
    desc: "VS Code: extension pack (33 extensions — all or nothing)"
    type: vscode
    requires_vscode: true
    packages: >-
      charliermarsh.ruff
      esbenp.prettier-vscode
      eamodio.gitlens
      github.vscode-github-actions
      github.vscode-pull-request-github
      ms-python.python
      ms-python.vscode-pylance
      hashicorp.terraform
      redhat.vscode-yaml
      shinichi-takii.sql-bigquery
      sqlfluff.vscode-sqlfluff
      gruntfuggly.todo-tree
      samuelcolvin.jinjahtml
      christian-kohler.path-intellisense
      fill-labs.dependi
      grapecity.gc-excelviewer
      mechatroner.rainbow-csv
      moshfeu.compare-folders
      ms-toolsai.jupyter
      ms-toolsai.jupyter-keymap
      ms-toolsai.jupyter-renderers
      ms-toolsai.vscode-jupyter-cell-tags
      ms-toolsai.vscode-jupyter-slideshow
      pkief.material-icon-theme
      randomfractalsinc.vscode-data-preview
      tamasfe.even-better-toml
      tomoki1207.pdf
      ms-vscode-remote.remote-containers
      aaron-bond.better-comments
      chrmarti.regex
      dvirtz.parquet-viewer
      johnpapa.vscode-peacock
      george-alisson.html-preview-vscode
