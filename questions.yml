---
# Machine decisions this layer offers. Merged (union by id) across layers like
# capabilities, and prompted by bootstrap; the answers live in
# ~/.config/computer-setup/prefs.yml.
#
# A capability expresses "yes/no, independently". A question expresses a decision
# with exactly one answer — which editor, where things live. If a choice would
# otherwise have to be hardcoded in the engine, it is a question.
#
# Schema, the machine tier, and the rules for `validate` patterns (checked by two
# different regex engines, so only their common subset is safe) are specified in
# the engine: docs/architecture.md, "The question model". The reference layer at
# examples/example-layer/questions.yml carries the field-by-field schema.

questions:
  # ─── git identity ──────────────────────────────────────────────────────────
  # No default: an adopter of this public layer is asked outright. A private
  # layer overrides these by id to pre-fill its own account (see the personal
  # layer) — an address belongs to the ACCOUNT, not the machine.
  - id: git-name
    type: text
    desc: "Git user.name"
    default: ""
    set_var: git_user_name
    validate: "^.+$"

  - id: git-email
    type: text
    desc: "Git user.email"
    default: ""
    set_var: git_user_email
    # Deliberately loose — catches a typo or an empty answer, not RFC 5322.
    validate: "^[^ @]+@[^ @]+\\.[^ @]+$"

  # One answer drives BOTH $EDITOR and git's core.editor, so they cannot
  # disagree. This governs the DEFAULT editor only: installing one is still a
  # capability, and an already-installed editor is still adopted and configured.
  - id: editor
    type: select
    desc: "Default editor (git core.editor and $EDITOR)"
    default: vscode
    options:
      - value: vscode
        desc: "Visual Studio Code"
        implies: [vscode]
        set:
          git_editor: "code --wait"
          editor_command: "code"
      - value: zed
        desc: "Zed"
        implies: [zed]
        set:
          git_editor: "zed --wait"
          editor_command: "zed"
      - value: none
        desc: "Leave unmanaged — respect whatever $EDITOR is already set to"
        set:
          git_editor: ""
          editor_command: ""

  # Where repositories are cloned — a machine-tier decision (see the engine's
  # docs/architecture.md), so it is answered here rather than hardcoded.
  - id: repositories-dir
    type: path
    desc: "Where repositories are cloned"
    default: "{{ home_dir }}/Projects"
    set_var: repositories_base_dir
    # NOT anchored to `^/`: at prompt time the default is still the literal
    # "{{ home_dir }}/Projects" (bootstrap does not render Jinja), so an
    # absolute-path anchor would reject this file's own default. Catches the
    # real failures instead — empty, or containing a space.
    validate: "^[^ ]+$"

  # An unattended daily ansible-pull is a real decision, so it gets asked.
  # Saying no keeps the `computer-setup` command and installs no agents.
  - id: drift-agents
    type: bool
    desc: "Install the scheduled daily upgrade and drift-check agents"
    default: "true"
    set_var: drift_correction_enabled

  - id: drift-upgrade-hour
    type: text
    desc: "Hour of the daily unattended upgrade (0-23)"
    default: "9"
    set_var: drift_correction_upgrade_schedule_hour
    # Written verbatim into a LaunchAgent plist, where a non-integer silently
    # produces an agent that never fires.
    validate: "^([0-9]|1[0-9]|2[0-3])$"

  - id: drift-check-hour
    type: text
    desc: "Hour of the daily drift check (0-23)"
    default: "10"
    set_var: drift_correction_schedule_hour
    validate: "^([0-9]|1[0-9]|2[0-3])$"
