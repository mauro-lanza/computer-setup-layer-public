---
# Schema, machine tier and `validate` rules: engine docs/architecture.md, "The question model".

questions:
  # No default: an adopter is asked outright; private layers override by id.
  - id: git-name
    type: text
    desc: "Git user.name"
    default: ""
    set_var: git_user_name
    validate: "^.+$"

  - id: git-email
    type: text
    desc: "Git user.email"
    default: ""
    set_var: git_user_email
    # Loose on purpose: catches typos and empty answers, not RFC 5322.
    validate: "^[^ @]+@[^ @]+\\.[^ @]+$"

  # One answer drives both $EDITOR and git's core.editor.
  - id: editor
    type: select
    desc: "Default editor (git core.editor and $EDITOR)"
    default: vscode
    options:
      - value: vscode
        desc: "Visual Studio Code"
        implies: [vscode]
        set:
          git_editor: "code --wait"
          editor_command: "code"
      - value: zed
        desc: "Zed"
        implies: [zed]
        set:
          git_editor: "zed --wait"
          editor_command: "zed"
      - value: none
        desc: "Leave unmanaged — respect whatever $EDITOR is already set to"
        set:
          git_editor: ""
          editor_command: ""

  - id: repositories-dir
    type: path
    desc: "Where repositories are cloned"
    default: "{{ home_dir }}/Projects"
    set_var: repositories_base_dir
    # Not anchored to `^/`: the default is an unrendered Jinja string at prompt time.
    validate: "^[^ ]+$"

  - id: drift-agents
    type: bool
    desc: "Install the scheduled daily upgrade and drift-check agents"
    default: "true"
    set_var: drift_correction_enabled

  - id: drift-upgrade-hour
    type: text
    desc: "Hour of the daily unattended upgrade (0-23)"
    default: "9"
    set_var: drift_correction_upgrade_schedule_hour
    # A non-integer here yields a LaunchAgent that never fires.
    validate: "^([0-9]|1[0-9]|2[0-3])$"

  - id: drift-check-hour
    type: text
    desc: "Hour of the daily drift check (0-23)"
    default: "10"
    set_var: drift_correction_schedule_hour
    validate: "^([0-9]|1[0-9]|2[0-3])$"
