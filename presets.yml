---
# A preset is a pure prefill: it seeds the prompts and is never recorded.

presets:
  - id: full
    desc: "Full workstation — development, data tooling, and desktop apps"
    answers:
      editor: vscode
      drift-agents: "true"
    capabilities:
      # Runtimes and package tooling
      - nvm
      - tfenv
      - python-311
      # Development
      - ansible-lint
      - shellcheck
      - docker-cli
      - docker-desktop
      - colima
      - fswatch
      - terraform-docs
      - ripgrep
      - bun
      - duckdb
      - act
      - check-merged-branches
      - crane
      # AI / editors
      - opencode
      - opencode-desktop
      - vscode
      - vscode-extensions
      - zed
      - gemini-cli
      - antigravity
      - lm-studio
      # Cloud
      - gcloud
      # Desktop
      - 1password
      - firefox
      - stats
      - obsidian
      - postman
      - notunes
      - spotify
      - discord

  - id: minimal
    desc: "Minimal — shell, git, and core CLI tools only"
    answers:
      editor: none
      drift-agents: "false"
    capabilities:
      - ripgrep
